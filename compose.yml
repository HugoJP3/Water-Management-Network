services:
  # Broker Kafka en modo KRaft (sin Zookeeper)
  broker:
    image: apache/kafka:latest
    hostname: broker
    container_name: broker
    ports:
      - 9092:9092
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
  
      KAFKA_BROKER_ID: 1
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093      

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://${EC2_PUBLIC_IP}:9092
      
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: "gTBb85_WRXu6oQgq-brTQw"
    restart: unless-stopped

  # Módulo Central de WM
  central:
    build: ./WM_Central
    container_name: wm_central
    depends_on:
      - broker
    command: ["python", "wm_central.py", "5000", "broker:29092", "--web-port", "8080"]
    ports:
      - "5000:5000"              # sockets de los Monitores
      - "8080:8080"              # panel web -> http://localhost:8080
    environment:
      TZ: "Europe/Madrid"
      WM_DB_PATH: /data/wm_central.db
      PANEL_PASSWORD: "${PANEL_PASSWORD:?Define PANEL_PASSWORD en .env}" # Futura contraseña del panel web (si no se define, no hay contraseña)
      PANEL_USER: "${PANEL_USER:-admin}" # Usuario del panel web (por defecto admin)
    volumes:
      - central-data:/data       # la BD SQLite sobrevive a reinicios
    restart: unless-stopped


volumes:
  central-data: